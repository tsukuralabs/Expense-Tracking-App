<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 900px;">
      <div class="card-body p-4">
        <h4 class="mb-4 fw-bold text-primary">Expense Tracker</h4>

        <!-- Expense Form (Matches layout in image) -->
        <form id="expenseForm" class="row g-3 align-items-end mb-4">
          <div class="col-md-3">
            <label for="expenseAmount" class="form-label fw-semibold">
              Choose expenseamount:
            </label>
            <input
              type="number"
              class="form-control"
              id="expenseAmount"
              placeholder="e.g. 100"
              required
            />
          </div>

          <div class="col-md-4">
            <label for="expenseDescription" class="form-label fw-semibold">
              Choose description:
            </label>
            <input
              type="text"
              class="form-control"
              id="expenseDescription"
              placeholder="e.g. On vacation"
              required
            />
          </div>

          <div class="col-md-3">
            <label for="expenseCategory" class="form-label fw-semibold">
              Choose a category:
            </label>
            <select class="form-select" id="expenseCategory" required>
              <option value="fuel">fuel</option>
              <option value="food">food</option>
              <option value="Movie">Movie</option>
              <option value="electricity">electricity</option>
              <option value="other">other</option>
            </select>
          </div>

          <div class="col-md-2 d-grid gap-1">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              Add Expense
            </button>
            <button type="button" id="cancelBtn" class="btn btn-sm btn-outline-secondary d-none">
              Cancel
            </button>
          </div>
        </form>

        <hr />

        <!-- Expense List -->
        <ul id="expenseList" class="list-group list-group-flush mt-3">
          <!-- Expenses will be rendered here dynamically -->
        </ul>
      </div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
